[package]
name = "logitux-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LogiTux GUI for Logitech mice"

[[bin]]
name = "logitux-gui"
path = "src/main.rs"

[dependencies]
logitux-hidpp.workspace = true
logitux-transport.workspace = true
logitux-devices.workspace = true
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
