[workspace]
resolver = "2"
members = [
    "crates/logitux-hidpp",
    "crates/logitux-transport",
    "crates/logitux-devices",
    "crates/logitux-cli",
    "crates/logitux-gui",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["LogiTux Contributors"]
repository = "https://github.com/furkan5665st/logitux"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
hidapi = "2.6"
eframe = "0.31"
logitux-hidpp = { path = "crates/logitux-hidpp" }
logitux-transport = { path = "crates/logitux-transport" }
logitux-devices = { path = "crates/logitux-devices" }
